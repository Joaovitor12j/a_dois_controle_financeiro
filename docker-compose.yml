services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: controle_app
    restart: unless-stopped
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "9000:9000"
    environment:
      # Config de banco vem do .env / .env.testing. Definir DB_* aqui vira
      # variável de ambiente real e o Dotenv não a sobrescreve — os testes
      # acabariam rodando no banco de desenvolvimento.
      - PHP_OPCACHE_ENABLE=1
    depends_on:
      - postgres
    networks:
      - controle

  nginx:
    image: nginx:alpine
    container_name: controle_nginx
    restart: unless-stopped
    ports:
      - "8083:80"
    volumes:
      - .:/app
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - controle

  postgres:
    image: postgres:17
    container_name: controle_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: controle_total
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5487:5432"
    networks:
      - controle

volumes:
  postgres_data:

networks:
  controle:
    driver: bridge
